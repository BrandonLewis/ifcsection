name: Release

# Tag vX.Y.Z (matching pyproject's version) to publish the Blender add-on zip
# as a GitHub release asset.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Version matches the tag
        run: |
          python - <<'PY'
          import os, sys, tomllib
          ver = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if tag != ver:
              sys.exit(f"tag {tag} != pyproject version {ver}")
          PY
      - run: |
          pip install -e .
          python -m ifcsection --out "dist/ifcsection_addon-${GITHUB_REF_NAME}.zip"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" \
            --notes "Install: Blender > Edit > Preferences > Add-ons > Install from Disk > the zip. Needs Bonsai (it provides ifcopenshell). See CHANGELOG.md."
