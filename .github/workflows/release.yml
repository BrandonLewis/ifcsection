name: Release

# Publish the Blender add-on zip as a GitHub release for pyproject's version.
# Either push a tag vX.Y.Z (it must match the version), or run this workflow
# by hand on main: it then tags vX.Y.Z itself (useful where a tag push is
# refused at the transport; this path needs only the Actions API).
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Resolve the version (a pushed tag must match pyproject)
        id: ver
        run: |
          python - <<'PY'
          import os, sys, tomllib
          ver = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if os.environ["GITHUB_EVENT_NAME"] == "push":
              tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
              if tag != ver:
                  sys.exit(f"tag {tag} != pyproject version {ver}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"tag=v{ver}\n")
          PY
      - run: |
          pip install -e .
          python -m ifcsection --out "dist/ifcsection_addon-${{ steps.ver.outputs.tag }}.zip"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" dist/*.zip \
            --target "$GITHUB_SHA" --title "${{ steps.ver.outputs.tag }}" \
            --notes "Install: Blender > Edit > Preferences > Add-ons > Install from Disk > the zip. Needs Bonsai (it provides ifcopenshell). See CHANGELOG.md."
