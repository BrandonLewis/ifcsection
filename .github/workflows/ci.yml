name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install -U pip
          pip install -e '.[test]'
      # the Blender tests skip here: no bpy
      - run: python -m pytest -q

  blender:
    # the add-on driven headless through the bpy wheel (Blender 5.2, Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: |
          python -m pip install -U pip
          pip install -e '.[test]' bpy==5.2.3
      - run: python -m pytest -q tests/blender

  addon-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: |
          pip install -e .
          python -m ifcsection --out dist/ifcsection_addon.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ifcsection_addon
          path: dist/ifcsection_addon.zip
